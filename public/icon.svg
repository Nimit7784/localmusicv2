<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#141923" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="ring" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#1e2638" stop-opacity="0" />
      <stop offset="100%" stop-color="#2a344d" stop-opacity="0.8" />
    </radialGradient>
  </defs>
  
  <!-- Outer Chassis -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#222b3d" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />
  
  <!-- Vinyl / Turntable Precision Grooves -->
  <circle cx="256" cy="256" r="180" fill="#0f131c" stroke="#1b212f" stroke-width="2" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#161c28" stroke-width="1.5" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#161c28" stroke-width="1.5" />
  <circle cx="256" cy="256" r="90" fill="none" stroke="#161c28" stroke-width="1.5" />
  
  <!-- Center Hi-Fi Core -->
  <circle cx="256" cy="256" r="64" fill="url(#gold)" />
  <circle cx="256" cy="256" r="24" fill="#0b0e14" />
  <circle cx="256" cy="256" r="10" fill="#fbbf24" />

  <!-- Acoustic Sine Waves / Soundwave Arc -->
  <path d="M 130 256 A 126 126 0 0 1 382 256" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  <path d="M 160 256 A 96 96 0 0 1 352 256" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.7" />
</svg>
