<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="appleMusicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa243c" />
      <stop offset="50%" stop-color="#fa2d48" />
      <stop offset="100%" stop-color="#ff3b68" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle with 15% safe padding for Android Maskable Icon -->
  <rect width="512" height="512" rx="112" fill="url(#appleMusicGrad)" />
  
  <!-- Inner Note Glow -->
  <circle cx="256" cy="256" r="160" fill="white" opacity="0.08" />

  <!-- Apple Music Beamed Musical Notes -->
  <g fill="white" filter="url(#shadow)">
    <!-- Left Note Head -->
    <ellipse cx="196" cy="344" rx="44" ry="32" transform="rotate(-20 196 344)" />
    <!-- Right Note Head -->
    <ellipse cx="340" cy="308" rx="44" ry="32" transform="rotate(-20 340 308)" />
    <!-- Left Stem -->
    <rect x="224" y="152" width="20" height="186" rx="6" />
    <!-- Right Stem -->
    <rect x="368" y="116" width="20" height="186" rx="6" />
    <!-- Connecting Top Beam -->
    <path d="M 224 152 L 388 116 L 388 162 L 224 198 Z" />
    <!-- Inner Top Cutout Contour -->
    <path d="M 224 212 L 388 176 L 388 184 L 224 220 Z" opacity="0.25" fill="#fa2d48" />
  </g>
</svg>
